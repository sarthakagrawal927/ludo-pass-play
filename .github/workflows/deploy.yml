name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm build
      - name: Deploy existing Pages project
        run: pnpm exec wrangler pages deploy dist --project-name ludo-pass-play --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
